name: Sync Fork on Non-Infra Soulmate Commits

on:
  push:
    branches:
      - main

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-fork-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Get committer username and commit info
        id: get_committer
        run: |
          COMMITTER=$(git log -1 ${{ github.event.after }} --pretty=format:'%an')
          COMMIT_MSG=$(git log -1 ${{ github.event.after }} --pretty=format:'%s')
          echo "committer=$COMMITTER" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "Committer: $COMMITTER"
          echo "Commit Message: $COMMIT_MSG"

      - name: Check if committer is not infra-soulmate
        id: check_committer
        run: |
          if [ "${{ steps.get_committer.outputs.committer }}" != "infra-soulmate" ]; then
            echo "should_sync=true" >> $GITHUB_OUTPUT
            echo "Committer is not infra-soulmate, will create empty commit"
          else
            echo "should_sync=false" >> $GITHUB_OUTPUT
            echo "Committer is infra-soulmate, skipping sync"
          fi

      - name: Create empty commit
        if: steps.check_committer.outputs.should_sync == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          git config user.name "infra-soulmate"
          git config user.email "infra@ivysoulmate.com"
          COMMIT_MSG="Build: ${{ steps.get_committer.outputs.commit_msg }} by ${{ steps.get_committer.outputs.committer }}"
          git commit --allow-empty -m "$COMMIT_MSG"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/Coconut-ERP/erp-miniapp-ui.git HEAD:${{ github.ref_name }}

      - name: Trigger fork sync
        if: steps.check_committer.outputs.should_sync == 'true'
        env:
          FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          # Get the current branch name
          BRANCH_NAME="${{ github.ref_name }}"

          # Trigger sync on the fork repository
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $FORK_TOKEN" \
            https://api.github.com/repos/infra-soulmate/coconut-erp-ui/merge-upstream \
            -d "{\"branch\":\"$BRANCH_NAME\"}"

          echo "Triggered sync for branch: $BRANCH_NAME"
